<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>標本 #1 - 砂岩碎片</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
    <div class="max-w-4xl mx-auto p-4 sm:p-6">
        
<main class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden p-6 sm:p-8">
    <!-- Header -->
    <a href="index.html" class="text-sm font-medium text-amber-600 hover:text-amber-700"> ← 返回標本列表 </a>
    <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-6">
        <div>
            <span class="text-sm font-bold text-amber-600">#1</span>
            <h1 class="text-2xl font-bold text-slate-900">砂岩碎片</h1>
        </div>
        
        <span class="bg-amber-600 text-white text-xs font-semibold px-3 py-1.5 rounded-full"> 沉積岩 </span>
        
    </div>

    <!-- Image Gallery -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
        
        <div class="space-y-1">
            <div class="aspect-4/3 rounded-lg overflow-hidden border border-slate-200 bg-slate-900">
                <img src="img/1-1.jpeg" alt="正面" class="w-full h-full object-cover" />
            </div>
            <p class="text-xs text-center text-slate-400">正面</p>
        </div>
        
        <div class="space-y-1">
            <div class="aspect-4/3 rounded-lg overflow-hidden border border-slate-200 bg-slate-900">
                <img src="img/1-2.jpeg" alt="背面" class="w-full h-full object-cover" />
            </div>
            <p class="text-xs text-center text-slate-400">背面</p>
        </div>
        
    </div>

    <!-- Metadata Table -->
    <div class="overflow-hidden border border-slate-200 rounded-lg mb-8">
        <table class="w-full text-left text-sm">
            <tr class="border-b border-slate-200 bg-slate-50">
                <th class="py-3 px-4 font-semibold text-slate-700 w-1/3">採集地點</th>
                <td class="py-3 px-4 text-slate-600">台灣嘉義縣</td>
            </tr>
            <tr class="border-b border-slate-200">
                <th class="py-3 px-4 font-semibold text-slate-700 bg-slate-50">岩石分類</th>
                <td class="py-3 px-4 text-slate-600">沉積岩</td>
            </tr>
            <tr class="border-b border-slate-200 bg-slate-50">
                <th class="py-3 px-4 font-semibold text-slate-700">預估岩性</th>
                <td class="py-3 px-4 text-slate-600">砂岩 / 泥質砂岩</td>
            </tr>
            <tr>
                <th class="py-3 px-4 font-semibold text-slate-700 bg-slate-50">尺寸大小</th>
                <td class="py-3 px-4 text-slate-600">約 2~3 cm</td>
            </tr>
        </table>
    </div>

    <!-- Observations -->
    <div class="bg-amber-50/50 border-l-4 border-amber-500 p-4 rounded-r-lg mb-8">
        <h3 class="font-semibold text-amber-900 text-sm mb-2">🔍 野外觀察與巨觀特徵</h3>
        <ul class="list-disc list-inside space-y-1 text-sm text-slate-700">
            
            <li>表面呈棕褐色，顯示出一定程度的鐵質氧化風化層。</li>
            
            <li>正面具細微的層理或風化紋理。</li>
            
            <li>顆粒較細緻，質地較為硬實。</li>
            
        </ul>
    </div>

    <!-- Image-description -->
     
    <div class="flex gap-5">
        <div class="aspect-4/3 rounded-lg overflow-hidden border border-slate-200 bg-slate-900 max-w-2/5">
            <img src="img/1-1.jpeg" alt="" class="w-full h-full object-cover" />
        </div>
        <div class="max-w-3/5"></div>
    </div>
     

    <!-- Back Button -->
    <a href="index.html" class="inline-flex items-center text-sm font-medium text-amber-600 hover:text-amber-700"> ← 返回標本列表 </a>
</main>

    </div>
</body>
</html>
